table:
  name: users
  schema: public
array_relationships:
  - name: posts
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: posts
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - email
        - name
        - user_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - email
        - id
        - name
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - email
        - name
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
    comment: ""
